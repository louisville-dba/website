[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.161.1"
  HUGO_ENV = "production"
  TZ = "America/Denver"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture --buildDrafts -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --buildFuture --buildDrafts -b $DEPLOY_PRIME_URL"
